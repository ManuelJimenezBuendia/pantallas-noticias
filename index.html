<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Noticias de ciencia</title>
<script src="recursos/qrcode.min.js"></script>
<!--
  Pantalla de noticias para Anthias (contenido de tipo web, 1920x1080). Dos fuentes:
  - SINC (por defecto): lee el RSS de la Agencia SINC desde el navegador; SINC lo permite
    (Access-Control-Allow-Origin: *) y sus textos tienen licencia CC BY 4.0.
  - UPCT (fuente=upct): lee datos/upct.json, que actualiza cada hora una tarea programada de
    GitHub (.github/workflows/upct.yml con scripts/upct.py): la web de la UPCT no tiene RSS ni
    deja leerla desde otra web.
  Muestra las últimas noticias, una cada vez, con foto, resumen y un QR a la noticia completa.

  Sin parámetros: SINC, todas las secciones, 12 s por noticia y 305 s en total (25 noticias;
  en Anthias, 305 s). Con fuente=upct: 10 noticias de 12 s, 125 s en Anthias, foto a pantalla
  completa.

  Parámetros opcionales de la URL:
    fuente=upct                     noticias de la UPCT (sin secciones: no admite categorias)
    diseno=foto | mitad             foto a pantalla completa con el texto encima (por defecto
                                    en la UPCT) o foto a media pantalla (por defecto en SINC)
    categorias=Ciencia,Tecnología   secciones (por defecto, todas). Las de SINC: Ciencia,
                                    Tecnología, Innova, Tierra, Salud y Sociedad (sin importar
                                    tildes ni mayúsculas)
    segundos=12                     segundos por noticia
    duracion=305                    duración total, la misma que en Anthias: la página calcula
                                    cuántas noticias caben, dejando 5 s para la carga
                                    (305 s y 12 s por noticia → 25 noticias). Manda sobre n.
                                    Si no hay noticias para llenarla, vuelve a empezar.
    n=3                             en vez de la duración, el número de noticias; al acabar se
                                    queda en la última (1 a 60; con más de 8, la barra de
                                    progreso es de la noticia actual, con un contador «3 / 25»)
    Ejemplo corto: ?categorias=ciencia,tecnologia,innova,tierra&n=3&segundos=8 (26 s)
    bucle=1                         vuelve a empezar al acabar (si no, se queda en la última,
                                    porque Anthias recarga la página cada vez que la muestra)
    pausa=1                        no pasa de noticia (para capturas); inicio=k empieza en la k-ésima
-->
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("recursos/inter-latin.woff2") format("woff2");
  }
  :root {
    --fondo: #0e1a2b;
    --panel: #132540;
    --texto: #ffffff;
    --suave: #b8c5d8;
    --acento: #f28c28;
    --linea: #2a3f5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: var(--fondo); color: var(--texto);
    font-family: Inter, "DejaVu Sans", Arial, sans-serif;
  }

  .noticia { position: absolute; inset: 0; display: grid; grid-template-columns: 50% 50%; grid-template-rows: 100vh; }
  .noticia.sin-foto { grid-template-columns: 100%; }
  .foto { position: relative; overflow: hidden; background: #000; }
  .sin-foto .foto { display: none; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4vh 3vh 2vh; font-size: 1.9vh; color: #e8eef6;
    background: linear-gradient(transparent, rgba(0, 0, 0, .75));
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .texto {
    display: flex; flex-direction: column; padding: 4.5vh 6vh 9vh; background: var(--panel);
    height: 100vh; overflow: hidden;
  }
  /* Logo de la UPCT · ETSII (en blanco), arriba a la derecha del texto */
  .marca { flex: none; display: flex; justify-content: flex-end; margin-bottom: 3.2vh; }
  .marca img { display: block; height: 6vh; aspect-ratio: 927 / 109; }
  .meta { display: flex; align-items: center; gap: 2.2vh; font-size: 2.6vh; color: var(--suave); }
  .cat {
    background: var(--acento); color: #1b1206; font-weight: 800;
    text-transform: uppercase; letter-spacing: .08em;
    padding: .7vh 1.6vh; border-radius: .6vh; font-size: 2.3vh;
  }
  h1 {
    margin-top: 3.5vh; font-size: 6.2vh; line-height: 1.12; font-weight: 800; flex: none;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta, .resumen, .pie { flex: none; }
  .resumen {
    margin-top: 3vh; font-size: 3.1vh; line-height: 1.38; color: var(--suave);
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pie { margin-top: auto; display: flex; align-items: center; gap: 3vh; padding-top: 3vh; }
  .qr { background: #fff; padding: 1.2vh; border-radius: .8vh; line-height: 0; flex: none; }
  .qr img, .qr canvas { width: 18vh !important; height: 18vh !important; }
  .fuente { font-size: 2.3vh; line-height: 1.45; color: var(--suave); }
  .fuente b { display: block; color: var(--texto); font-size: 2.9vh; margin-bottom: .6vh; }
  .progreso {
    position: absolute; left: 50%; right: 0; bottom: 0; display: flex; align-items: center;
    gap: .6vh; padding: 0 6vh 3.5vh;
  }
  .contador {
    flex: none; margin-left: 1.4vh; font-size: 2.2vh; line-height: 1; color: var(--suave);
    font-variant-numeric: tabular-nums;
  }
  .progreso i { flex: 1; height: .8vh; background: var(--linea); border-radius: .4vh; overflow: hidden; }
  .progreso b { display: block; height: 100%; width: 0; background: var(--acento); }
  .progreso .hecha b { width: 100%; }
  .progreso .pausa b { width: 45%; }
  .progreso .activa b { animation: llenar var(--duracion, 8s) linear forwards; }
  @keyframes llenar { from { width: 0; } to { width: 100%; } }
  .texto, .foto img { transition: opacity .6s ease; }
  .oculto .texto, .oculto .foto img { opacity: 0; }

  /* Diseño «foto»: foto a pantalla completa y el texto encima, abajo (fotos apaisadas) */
  .foto-completa .noticia, .foto-completa .noticia.sin-foto { display: block; }
  .foto-completa .foto { position: absolute; inset: 0; }
  .foto-completa .foto figcaption { display: none; }
  .foto-completa .texto {
    position: absolute; inset: 0; height: auto; padding: 4.5vh 6vh 7.5vh;
    background: linear-gradient(to bottom, rgba(8, 15, 26, .8) 0, rgba(8, 15, 26, .5) 11%,
                rgba(8, 15, 26, 0) 24%, rgba(8, 15, 26, 0) 40%, rgba(8, 15, 26, .9) 66%,
                rgba(8, 15, 26, .96) 100%);
    display: grid; grid-template-columns: 1fr auto; column-gap: 6vh;
    grid-template-rows: auto 1fr auto auto auto;
  }
  .foto-completa .sin-foto .texto { background: var(--panel); }
  .foto-completa .marca { grid-column: 1 / -1; grid-row: 1; }
  .foto-completa .marca img { filter: drop-shadow(0 0 .8vh rgba(0, 0, 0, .55)); }
  .foto-completa .meta { grid-column: 1; grid-row: 3; }
  .foto-completa h1 {
    grid-column: 1; grid-row: 4; margin-top: 2vh; font-size: 5.6vh; -webkit-line-clamp: 3;
    text-shadow: 0 .2vh 1vh rgba(0, 0, 0, .5);
  }
  .foto-completa .resumen {
    grid-column: 1; grid-row: 5; margin-top: 2.2vh; font-size: 2.9vh; color: #dbe4f0;
    -webkit-line-clamp: 2;
  }
  .foto-completa .pie {
    /* Abarca también la fila elástica: si no, su altura estira la del resumen. */
    grid-column: 2; grid-row: 2 / 6; align-self: end; margin: 0; padding: 0;
    flex-direction: column; gap: 1.8vh; text-align: center;
  }
  .foto-completa .fuente { color: #dbe4f0; }
  .foto-completa .progreso { left: 0 !important; padding-bottom: 3vh; }

  .vacio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .vacio p { font-size: 5vh; font-weight: 800; }
  .vacio img { display: block; width: min(76vw, 135vh); aspect-ratio: 927 / 109; margin: 0 auto; }
  .vacio small { display: block; margin-top: 4vh; font-size: 3.2vh; color: var(--suave); font-weight: 400; }
</style>
</head>
<body>
<main id="raiz"></main>

<script>
"use strict";

const URL_RSS = "https://www.agenciasinc.es/feed/Noticias";
const URL_UPCT = "datos/upct.json";

const params = new URLSearchParams(location.search);
// Fuente: SINC (por defecto) o la UPCT.
const UPCT = (params.get("fuente") || "").trim().toLowerCase() === "upct";
const CLAVE_CACHE = UPCT ? "noticias_upct" : "noticias_sinc";
// Valores por defecto: 12 s por noticia; SINC, 305 s (25 noticias); UPCT, 125 s (10 noticias).
const SEGUNDOS_DEFECTO = 12;
const DURACION_DEFECTO = UPCT ? 125 : 305;
// Diseño: foto a pantalla completa (por defecto en la UPCT, con fotos apaisadas de actos) o a
// media pantalla (por defecto en SINC).
const DISENO = (params.get("diseno") || "").trim().toLowerCase();
const FOTO_COMPLETA = DISENO === "foto" || (UPCT && DISENO !== "mitad");
if (FOTO_COMPLETA) document.documentElement.classList.add("foto-completa");
if (UPCT) document.title = "Noticias de la UPCT";
const textoCategorias = (params.get("categorias") || "").trim();
const CATEGORIAS = !textoCategorias || textoCategorias.toLowerCase() === "todas" ? []
  : textoCategorias.split(",").map(s => s.trim()).filter(Boolean);
const SEGUNDOS = Math.max(4, parseInt(params.get("segundos") || "", 10) || SEGUNDOS_DEFECTO);
const MARGEN_CARGA = 5;    // segundos que se dejan para cargar la página
// Si se indica n (y no la duración), se muestran n noticias y se acaba en la última.
const DURACION = params.has("duracion") ? parseInt(params.get("duracion"), 10) || 0
  : params.has("n") ? 0 : DURACION_DEFECTO;
const N = Math.max(1, Math.min(60, DURACION > 0
  ? Math.floor((DURACION - MARGEN_CARGA) / SEGUNDOS)
  : parseInt(params.get("n") || "3", 10) || 3));
const MAX_SEGMENTOS = 8;   // con más noticias, una sola barra y un contador
const PAUSA = params.get("pausa") === "1";
const BUCLE = params.get("bucle") === "1";
const INICIO = parseInt(params.get("inicio") || "0", 10) || 0;

const raiz = document.getElementById("raiz");
const LOGO = "recursos/logo-upct-etsii.svg";
const NOMBRE_CENTRO = "ETSII · Universidad Politécnica de Cartagena";
const fechaLarga = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "long" });

// Texto plano a partir de un fragmento con HTML o entidades. Lo que viene del RSS
// nunca se inserta como HTML: siempre con textContent.
function textoPlano(s) {
  return new DOMParser().parseFromString(s || "", "text/html").body.textContent.replace(/\s+/g, " ").trim();
}
const aHttps = u => (u || "").replace(/^http:\/\//i, "https://");
const normalizar = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

function crear(etiqueta, clase, texto) {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto != null) e.textContent = texto;
  return e;
}

// Logo del centro; si no se puede cargar, en su lugar se pone el nombre (o nada).
function crearLogo(alFallar) {
  const img = crear("img");
  img.alt = NOMBRE_CENTRO;
  img.onerror = alFallar;
  img.src = LOGO;
  return img;
}

async function leerRss() {
  const control = new AbortController();
  const plazo = setTimeout(() => control.abort(), 10000);
  try {
    const r = await fetch(URL_RSS, { signal: control.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const noticias = [...xml.querySelectorAll("channel > item")].map(it => {
      const q = sel => (it.querySelector(sel)?.textContent || "").trim();
      return {
        titulo: textoPlano(q("title")),
        resumen: textoPlano(q("description")),
        enlace: aHttps(q("link")),
        fecha: q("pubDate"),
        autor: textoPlano(q("author")),
        categoria: textoPlano(q("category")),
        foto: aHttps(q("fotos > foto > url")),
        pieFoto: textoPlano(q("fotos > foto > texto")),
      };
    }).filter(n => n.titulo);
    if (!noticias.length) throw new Error("RSS vacío");
    try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(noticias)); } catch (e) {}
    return noticias;
  } catch (e) {
    // Sin conexión o RSS caído: última copia buena, si la hay.
    try {
      const copia = JSON.parse(localStorage.getItem(CLAVE_CACHE) || "null");
      if (Array.isArray(copia)) return copia;
    } catch (e2) {}
    return [];
  } finally {
    clearTimeout(plazo);
  }
}

// Noticias de la UPCT: las deja en datos/upct.json la tarea programada (scripts/upct.py).
// No tienen sección: sin etiqueta.
async function leerUpct() {
  const control = new AbortController();
  const plazo = setTimeout(() => control.abort(), 10000);
  try {
    const r = await fetch(URL_UPCT, { signal: control.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const noticias = ((await r.json()).noticias || []).map(n => ({
      titulo: textoPlano(n.titulo),
      resumen: textoPlano(n.resumen),
      enlace: aHttps(n.enlace),
      fecha: n.fecha,
      autor: "",
      categoria: "",
      foto: aHttps(n.fotoMediana || n.foto),
      pieFoto: textoPlano(n.pieFoto),
    })).filter(n => n.titulo);
    if (!noticias.length) throw new Error("sin noticias");
    try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(noticias)); } catch (e) {}
    return noticias;
  } catch (e) {
    try {
      const copia = JSON.parse(localStorage.getItem(CLAVE_CACHE) || "null");
      if (Array.isArray(copia)) return copia;
    } catch (e2) {}
    return [];
  } finally {
    clearTimeout(plazo);
  }
}

function elegir(noticias) {
  const buscadas = UPCT ? [] : CATEGORIAS.map(normalizar);
  return noticias
    .map(n => ({ ...n, fecha: new Date(n.fecha) }))
    .filter(n => !buscadas.length || buscadas.includes(normalizar(n.categoria)))
    .sort((x, y) => (y.fecha || 0) - (x.fecha || 0))
    .slice(0, N);
}

function probarFoto(url) {
  return new Promise(ok => {
    if (!url) return ok(null);
    const img = new Image();
    const plazo = setTimeout(() => ok(null), 10000);
    img.onload = () => { clearTimeout(plazo); ok(url); };
    img.onerror = () => { clearTimeout(plazo); ok(null); };
    img.src = url;
  });
}

// Las fotos originales del RSS pueden pesar varios MB. SINC publica una copia de unos
// 1300 px de ancho (la que usa su web) en «_aliases/img_1col/»: se prueba primero esa.
async function cargarFoto(url) {
  if (!url) return null;
  const reducida = url.replace("/storage/images/", "/storage/images/_aliases/img_1col/");
  return (reducida !== url && await probarFoto(reducida)) || probarFoto(url);
}

function ponerQr(contenedor, texto) {
  if (typeof QRCode === "undefined" || !texto) return;
  const caja = crear("div", "qr");
  contenedor.prepend(caja);
  new QRCode(caja, { text: texto, width: 256, height: 256, colorDark: "#0e1a2b", colorLight: "#ffffff",
                     correctLevel: QRCode.CorrectLevel.M });
}

// Que todo quepa en la pantalla: primero se reduce la letra del titular (hasta que entre
// en 4 líneas; 3 con la foto completa) y después se quitan líneas al resumen.
const AJUSTE = FOTO_COMPLETA ? { tam: 5.6, min: 4.4, lineas: 3, resumen: 2 }
                             : { tam: 6.2, min: 4.7, lineas: 4, resumen: 5 };
function ajustar(texto, titular, resumen) {
  titular.style.fontSize = "";
  resumen.style.webkitLineClamp = "";
  // El titular se mide sin recortar (en bloque) y se vuelve a recortar al final, por si acaso.
  titular.style.display = "block";
  titular.style.webkitLineClamp = "none";
  const lineas = () => titular.getBoundingClientRect().height /
                       (parseFloat(getComputedStyle(titular).fontSize) * 1.12);
  for (let tam = AJUSTE.tam; lineas() > AJUSTE.lineas + 0.2 && tam > AJUSTE.min; ) {
    tam -= 0.3;
    titular.style.fontSize = tam.toFixed(1) + "vh";
  }
  titular.style.display = "";
  titular.style.webkitLineClamp = "";
  for (let n = AJUSTE.resumen; texto.scrollHeight > texto.clientHeight + 2 && n > 1; ) {
    n -= 1;
    resumen.style.webkitLineClamp = String(n);
  }
}

async function mostrarNoticias(noticias) {
  const marco = crear("div", "noticia oculto");
  const figura = crear("figure", "foto");
  const img = crear("img");
  img.alt = "";
  const pieFoto = crear("figcaption");
  figura.append(img, pieFoto);
  const texto = crear("section", "texto");
  marco.append(figura, texto);
  // El logo es el mismo elemento en todas las noticias (no se vuelve a cargar).
  const marca = crear("div", "marca");
  marca.append(crearLogo(() => { marca.style.display = "none"; }));
  // Barra de progreso: un segmento por noticia o, si son muchas, una barra y un contador.
  const progreso = crear("div", "progreso");
  progreso.style.setProperty("--duracion", SEGUNDOS + "s");
  const segmentos = noticias.length <= MAX_SEGMENTOS;
  const barras = (segmentos ? noticias : [null]).map(() => {
    const barra = crear("i");
    barra.append(crear("b"));
    progreso.append(barra);
    return barra;
  });
  const contador = segmentos ? null : crear("span", "contador");
  if (contador) progreso.append(contador);
  raiz.append(marco, progreso);

  // Las fotos se cargan de una en una: la de la noticia actual y, mientras se ve, la siguiente.
  const fotos = [];
  const foto = k => fotos[k] || (fotos[k] = cargarFoto(noticias[k].foto));
  const siguiente = k => (k + 1) % noticias.length;
  let i = ((INICIO % noticias.length) + noticias.length) % noticias.length;

  async function mostrar() {
    const n = noticias[i];
    const url = await foto(i);
    if (noticias.length > 1) foto(siguiente(i));
    marco.classList.toggle("sin-foto", !url);
    progreso.style.left = url ? "50%" : "0";
    if (url) img.src = url; else img.removeAttribute("src");
    pieFoto.textContent = n.pieFoto;
    pieFoto.hidden = !n.pieFoto;

    const meta = crear("div", "meta");
    if (n.categoria) meta.append(crear("span", "cat", n.categoria));
    if (!isNaN(n.fecha)) meta.append(crear("span", "fecha", fechaLarga.format(n.fecha)));
    const pie = crear("div", "pie");
    const fuente = crear("div", "fuente");
    fuente.append(crear("b", null, "Lee la noticia completa"));
    if (UPCT) {
      fuente.append(document.createTextNode("Noticias de la UPCT"));
    } else {
      fuente.append(document.createTextNode("Agencia SINC" + (n.autor && n.autor !== "SINC" ? " · " + n.autor : "")),
                    crear("br"), document.createTextNode("Licencia CC BY 4.0"));
    }
    pie.append(fuente);
    ponerQr(pie, n.enlace);
    const titular = crear("h1", null, n.titulo);
    const resumen = crear("p", "resumen", n.resumen);
    texto.replaceChildren(marca, meta, titular, resumen, pie);
    ajustar(texto, titular, resumen);

    const actual = PAUSA ? "pausa" : "activa";
    if (segmentos) {
      barras.forEach((barra, k) => { barra.className = k < i ? "hecha" : k > i ? "" : actual; });
    } else {
      // Reiniciar la animación de la única barra.
      barras[0].className = "";
      void barras[0].offsetWidth;
      barras[0].className = actual;
      contador.textContent = (i + 1) + " / " + noticias.length;
    }
    marco.classList.remove("oculto");
  }

  // Si cambia el tamaño de la ventana (otra resolución), se vuelve a ajustar el texto.
  window.addEventListener("resize", () => {
    const titular = texto.querySelector("h1"), resumen = texto.querySelector(".resumen");
    if (titular && resumen) ajustar(texto, titular, resumen);
  });

  await mostrar();
  if (PAUSA || noticias.length < 2) return;
  // Cada noticia dura SEGUNDOS, contando el fundido de 0,6 s. Anthias vuelve a cargar la
  // página cada vez que le toca: al acabar, se queda en la última. Vuelve a empezar con
  // bucle=1 o si, con una duración indicada, no hay noticias para llenarla.
  const repetir = BUCLE || (DURACION > 0 && noticias.length * SEGUNDOS < DURACION - MARGEN_CARGA);
  (function programar() {
    setTimeout(async () => {
      if (!repetir && i === noticias.length - 1) return;
      marco.classList.add("oculto");
      await Promise.all([foto(siguiente(i)), new Promise(ok => setTimeout(ok, 600))]);
      i = siguiente(i);
      await mostrar();
      programar();
    }, Math.max(0, SEGUNDOS * 1000 - 600));
  })();
}

function sinNoticias() {
  const v = crear("div", "vacio");
  const p = crear("p");
  const logo = crearLogo(() => logo.replaceWith(NOMBRE_CENTRO));
  p.append(logo, crear("small", null, UPCT ? "Noticias de la UPCT" : "Noticias de ciencia y tecnología"));
  v.append(p);
  raiz.append(v);
}

(async () => {
  const noticias = elegir(await (UPCT ? leerUpct() : leerRss()));
  // Medir con la letra definitiva (Inter), no con la de reserva.
  try {
    await Promise.race([
      Promise.all(["400 30px Inter", "800 60px Inter"].map(f => document.fonts.load(f))),
      new Promise(ok => setTimeout(ok, 3000)),
    ]);
  } catch (e) {}
  if (noticias.length) mostrarNoticias(noticias); else sinNoticias();
})();
</script>
