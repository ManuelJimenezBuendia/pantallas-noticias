<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Noticias de ciencia</title>
<script src="recursos/qrcode.min.js"></script>
<!--
  Pantalla de noticias para Anthias (contenido de tipo web, 1920x1080). Dos fuentes:
  - SINC (por defecto): lee el RSS de la Agencia SINC desde el navegador; SINC lo permite
    (Access-Control-Allow-Origin: *) y sus textos tienen licencia CC BY 4.0.
  - UPCT (fuente=upct): lee datos/upct.json, que actualiza cada hora una tarea programada de
    GitHub (.github/workflows/upct.yml con scripts/upct.py): la web de la UPCT no tiene RSS ni
    deja leerla desde otra web.
  Muestra las últimas noticias, una cada vez, con foto, resumen y un QR a la noticia completa.

  Diseño según el Manual de Identidad Corporativa de la UPCT (2026), «Sistema visual»
  (pp. 61-64): retícula de 3 columnas y 5 filas (5 × 3 en vertical) en la que foto, texto y
  manchas de color (el del centro, blanco y negro) ocupan módulos enteros. Titular, fechas y
  avisos en Funnel Sans Medium; el texto corrido, en Inter (en lugar de Helvetica Now Text, que
  es de pago). Color de cada centro y color del texto encima: pp. 54-55.

  Sin parámetros, con las dos fuentes: 20 noticias de 12 s, 245 s en total (en Anthias, 245 s).

  Parámetros opcionales de la URL:
    fuente=upct                     noticias de la UPCT (sin secciones: no admite categorias)
    diseno=foto | mitad             foto a sangre, con el titular en un bloque abajo (foto), o foto
                                    entera, sin recortar, junto a la columna del titular (mitad,
                                    por defecto con las dos fuentes)
    categorias=Ciencia,Tecnología   secciones (por defecto, todas). Las de SINC: Ciencia,
                                    Tecnología, Innova, Tierra, Salud y Sociedad (sin importar
                                    tildes ni mayúsculas)
    segundos=12                     segundos por noticia
    duracion=245                    duración total, la misma que en Anthias: la página calcula
                                    cuántas noticias caben, dejando 5 s para la carga
                                    (245 s y 12 s por noticia → 20 noticias). Manda sobre n.
                                    Si no hay noticias para llenarla, vuelve a empezar.
    n=3                             en vez de la duración, el número de noticias; al acabar se
                                    queda en la última (1 a 60; con más de 8, la barra de
                                    progreso es de la noticia actual, con un contador «3 / 25»)
    Ejemplo corto: ?categorias=ciencia,tecnologia,innova,tierra&n=3&segundos=8 (26 s)
    bucle=1                         vuelve a empezar al acabar (si no, se queda en la última,
                                    porque Anthias recarga la página cada vez que la muestra)
    pausa=1                        no pasa de noticia (para capturas); inicio=k empieza en la k-ésima
    vertical=1 | izquierda          pantalla vertical: retícula de 5 × 3, con la foto arriba, el
                                    titular en medio y el resto abajo (no admite diseno=foto).
                                    Si la ventana es vertical (la Raspberry gira la imagen), se usa
                                    sola, sin el parámetro. Si es horizontal (solo se ha girado el
                                    monitor), la página se gira 90° a la derecha; con «izquierda»,
                                    hacia el otro lado (si el texto sale boca abajo). vertical=0:
                                    siempre horizontal.
    escuela=etsii                   centro (por defecto, la ETSII): cambia el logo y el color.
                                    etsii, etsit, etsia, etsae, etsino, eicm, fce, cud, doctorado
                                    o formacion; o un nombre corto: industriales, teleco,
                                    agronomos, arquitectura, naval, caminos, empresa, defensa...
                                    (ver ESCUELAS). Logos de la identidad corporativa de la UPCT,
                                    en recursos/logos/.
-->
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("recursos/inter-latin.woff2") format("woff2");
  }
  /* Tipografía de la UPCT para titulares, fechas y webs (Google Fonts, licencia OFL). */
  @font-face {
    font-family: "Funnel Sans";
    font-style: normal;
    font-weight: 300 800;
    font-display: swap;
    src: url("recursos/funnel-sans-latin.woff2") format("woff2");
  }
  :root {
    /* Color del centro y del texto encima (blanco o negro, según el manual); los pone el script. */
    --color: #9b0000;
    --tinta: #ffffff;
    /* Unidad de los tamaños: 1 % del alto en horizontal, 1 % del ancho en vertical. */
    --u: 1vh;
    --ancho: 100vw;
    --margen: calc(3.6 * var(--u));
    --titulares: "Funnel Sans", Inter, Arial, sans-serif;
  }
  .vertical { --u: 1vw; }
  /* Pantalla girada sin que la Raspberry gire la imagen: el ancho útil es el alto de la ventana. */
  .girar { --u: 1vh; --ancho: 100vh; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Helvetica Now Text", Inter, "DejaVu Sans", Arial, sans-serif;
  }
  #raiz { position: fixed; inset: 0; overflow: hidden; }
  .girar #raiz {
    inset: auto; top: 50%; left: 50%; width: 100vh; height: 100vw;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  .girar.izquierda #raiz { transform: translate(-50%, -50%) rotate(-90deg); }

  /* Retícula: 3 columnas × 5 filas (módulos apaisados, como en el manual). Cada bloque ocupa
     módulos enteros (grid-area: fila inicial / columna inicial / fila final / columna final). */
  .noticia {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(5, 1fr);
  }
  .bloque { position: relative; overflow: hidden; min-width: 0; min-height: 0; }

  /* Diseño «mitad» (por defecto): la foto entera (3:2, sin recortar) en 2 × 4 módulos; a su
     izquierda, el logo sobre negro y el titular en el color del centro, que dobla abajo, bajo la
     foto, con el resumen; en la esquina, el QR sobre blanco. */
  .foto    { grid-area: 1 / 2 / 5 / 4; background: #000; }
  .marca   { grid-area: 1 / 1 / 2 / 2; background: #000; }
  .titulo  { grid-area: 2 / 1 / 6 / 2; background: var(--color); color: var(--tinta); }
  .resumen { grid-area: 5 / 2 / 6 / 3; background: var(--color); color: var(--tinta); }
  .pie     { grid-area: 5 / 3 / 6 / 4; background: #fff; color: #000; }

  /* Diseño «foto»: la foto a sangre; el titular, en un bloque de 2 × 2 módulos abajo a la
     izquierda; el resumen y el QR, en blanco a su derecha, y el logo, arriba a la derecha. */
  .a-sangre .foto    { grid-area: 1 / 1 / 6 / 4; }
  .a-sangre .marca   { grid-area: 1 / 3 / 2 / 4; }
  .a-sangre .titulo  { grid-area: 4 / 1 / 6 / 3; }
  .a-sangre .resumen { grid-area: 4 / 3 / 5 / 4; background: #fff; color: #000; }
  .a-sangre .pie     { grid-area: 5 / 3 / 6 / 4; }
  .a-sangre .foto figcaption { display: none; }
  .a-sangre .foto img { object-position: center 35%; }

  /* Vertical: 5 columnas × 3 filas (módulos alargados), partidas por la mitad para colocar el
     logo. Foto arriba; titular en medio; abajo, el resumen (en el color, que dobla), el logo
     sobre negro y el QR sobre blanco. */
  .vertical .noticia { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); }
  .vertical .foto    { grid-area: 1 / 1 / 3 / 6; }
  .vertical .titulo  { grid-area: 3 / 1 / 5 / 6; }
  .vertical .resumen { grid-area: 5 / 1 / 6 / 4; }
  .vertical .marca   { grid-area: 6 / 1 / 7 / 4; }
  .vertical .pie     { grid-area: 5 / 4 / 7 / 6; }

  /* Foto */
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: calc(4 * var(--u)) var(--margen) calc(1.8 * var(--u)); font-size: calc(1.8 * var(--u)); color: #fff;
    background: linear-gradient(transparent, rgba(0, 0, 0, .75));
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* Sin foto: el damero del escudo (positivo y negativo), en el color del centro y negro,
     con módulos del tamaño de la retícula. */
  .sin-foto .foto {
    background: repeating-conic-gradient(#000 0 25%, var(--color) 0 50%) 0 0 / 100% 50%;
  }
  .sin-foto.a-sangre .foto, .a-sangre .sin-foto .foto { background-size: calc(200% / 3) 40%; }
  .vertical .sin-foto .foto { background-size: 40% 200%; }
  .sin-foto .foto img, .sin-foto .foto figcaption { display: none; }

  /* Logo del centro (en negativo, sobre negro). Alrededor, al menos medio alto del logo libre
     (zona de protección del manual: el radio del escudo). */
  .marca { display: flex; align-items: center; padding: 0 var(--margen); }
  .marca img {
    display: block; height: calc(6 * var(--u)); width: auto; max-width: 100%;
    object-fit: contain; object-position: left center;
  }
  .vertical .marca img { height: calc(5.6 * var(--u)); }

  /* Titular */
  .titulo { display: flex; flex-direction: column; padding: var(--margen); }
  .meta {
    flex: none; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: calc(1.6 * var(--u));
    font-family: var(--titulares); font-weight: 500; font-size: calc(2.6 * var(--u)); line-height: 1.2;
  }
  .cat { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .cat::after { content: "·"; margin-left: calc(1.6 * var(--u)); font-weight: 500; }
  h1 {
    flex: none; margin-top: calc(2.4 * var(--u));
    font-family: var(--titulares); font-weight: 500; font-size: calc(6.6 * var(--u)); line-height: 1.08;
    letter-spacing: -.01em;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Resumen */
  .resumen { padding: var(--margen); }
  .resumen p {
    font-size: calc(2.5 * var(--u)); line-height: 1.35;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  .vertical .resumen p { font-size: calc(2.9 * var(--u)); }

  /* QR y fuente, sobre blanco */
  .pie { display: flex; align-items: center; gap: calc(2.6 * var(--u)); padding: 0 var(--margen); }
  .qr { flex: none; line-height: 0; }
  .qr img, .qr canvas { width: calc(15 * var(--u)) !important; height: calc(15 * var(--u)) !important; }
  .fuente { font-size: calc(1.9 * var(--u)); line-height: 1.4; }
  .fuente b {
    display: block; margin-bottom: calc(.8 * var(--u));
    font-family: var(--titulares); font-weight: 500; font-size: calc(2.6 * var(--u)); line-height: 1.15;
  }
  .vertical .pie { flex-direction: column; justify-content: center; align-items: flex-start; padding: var(--margen); }
  .vertical .qr img, .vertical .qr canvas { width: calc(26 * var(--u)) !important; height: calc(26 * var(--u)) !important; }
  .vertical .fuente { font-size: calc(2.4 * var(--u)); }
  .vertical .fuente b { font-size: calc(3.2 * var(--u)); }

  /* Barra de progreso, al pie del bloque del titular, en el color del texto. */
  .progreso {
    flex: none; margin-top: auto; padding-top: calc(2.4 * var(--u));
    display: flex; align-items: center; gap: calc(.6 * var(--u));
  }
  .progreso i { position: relative; flex: 1; height: calc(.6 * var(--u)); overflow: hidden; }
  .progreso i::before { content: ""; position: absolute; inset: 0; background: var(--tinta); opacity: .3; }
  .progreso b { position: relative; display: block; height: 100%; width: 0; background: var(--tinta); }
  .progreso .hecha b { width: 100%; }
  .progreso .pausa b { width: 45%; }
  .progreso .activa b { animation: llenar var(--duracion, 8s) linear forwards; }
  @keyframes llenar { from { width: 0; } to { width: 100%; } }
  .contador {
    flex: none; margin-left: calc(1.2 * var(--u)); line-height: 1;
    font-family: var(--titulares); font-weight: 500; font-size: calc(2.2 * var(--u));
    font-variant-numeric: tabular-nums;
  }

  /* Fundido entre noticias: cambia el contenido; los bloques de color se quedan. */
  .cambia { transition: opacity .6s ease; }
  .oculto .cambia { opacity: 0; }

  /* Sin noticias: el logo sobre negro. */
  .vacio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .vacio img { display: block; width: min(calc(.7 * var(--ancho)), calc(125 * var(--u))); height: auto; margin: 0 auto; }
  .vacio small {
    display: block; margin-top: calc(4 * var(--u));
    font-family: var(--titulares); font-weight: 500; font-size: calc(3.2 * var(--u));
  }
</style>
</head>
<body>
<main id="raiz"></main>

<script>
"use strict";

const URL_RSS = "https://www.agenciasinc.es/feed/Noticias";
const URL_UPCT = "datos/upct.json";

const params = new URLSearchParams(location.search);
// Fuente: SINC (por defecto) o la UPCT.
const UPCT = (params.get("fuente") || "").trim().toLowerCase() === "upct";
const CLAVE_CACHE = UPCT ? "noticias_upct" : "noticias_sinc";
// Valores por defecto, con las dos fuentes: 20 noticias de 12 s, 245 s (20 × 12 y 5 de carga).
const SEGUNDOS_DEFECTO = 12;
const DURACION_DEFECTO = 245;
// Diseño: foto entera junto a la columna del titular (por defecto) o foto a sangre (diseno=foto).
const DISENO = (params.get("diseno") || "").trim().toLowerCase();
// Pantalla vertical: sola si la ventana es vertical; con vertical=1 en una ventana horizontal
// (monitor girado sin girar la imagen), la página se gira 90° (a la izquierda con «izquierda»).
const PARAM_VERTICAL = (params.get("vertical") || "").trim().toLowerCase();
const VENTANA_VERTICAL = window.innerHeight > window.innerWidth;
const VERTICAL = !["0", "no"].includes(PARAM_VERTICAL) &&
  (VENTANA_VERTICAL || ["1", "si", "sí", "derecha", "izquierda"].includes(PARAM_VERTICAL));
if (VERTICAL) document.documentElement.classList.add("vertical");
if (VERTICAL && !VENTANA_VERTICAL) {
  document.documentElement.classList.add("girar");
  if (PARAM_VERTICAL === "izquierda") document.documentElement.classList.add("izquierda");
}
// En vertical no hay foto a sangre: recortaría casi dos tercios de cada foto.
const A_SANGRE = !VERTICAL && DISENO === "foto";
if (A_SANGRE) document.documentElement.classList.add("a-sangre");
if (UPCT) document.title = "Noticias de la UPCT";
const textoCategorias = (params.get("categorias") || "").trim();
const CATEGORIAS = !textoCategorias || textoCategorias.toLowerCase() === "todas" ? []
  : textoCategorias.split(",").map(s => s.trim()).filter(Boolean);
const SEGUNDOS = Math.max(4, parseInt(params.get("segundos") || "", 10) || SEGUNDOS_DEFECTO);
const MARGEN_CARGA = 5;    // segundos que se dejan para cargar la página
// Si se indica n (y no la duración), se muestran n noticias y se acaba en la última.
const DURACION = params.has("duracion") ? parseInt(params.get("duracion"), 10) || 0
  : params.has("n") ? 0 : DURACION_DEFECTO;
const N = Math.max(1, Math.min(60, DURACION > 0
  ? Math.floor((DURACION - MARGEN_CARGA) / SEGUNDOS)
  : parseInt(params.get("n") || "3", 10) || 3));
const MAX_SEGMENTOS = 8;   // con más noticias, una sola barra y un contador
const PAUSA = params.get("pausa") === "1";
const BUCLE = params.get("bucle") === "1";
const INICIO = parseInt(params.get("inicio") || "0", 10) || 0;

const raiz = document.getElementById("raiz");
// Centro (escuela=siglas o un nombre corto; por defecto, la ETSII): cambia el logo y el color.
// Logos de la identidad corporativa de la UPCT, en negativo y sin fondo, en
// recursos/logos/<clave>.svg. Color de cada centro y del texto encima (blanco o negro), los del
// Manual de Identidad de la UPCT (2026), pp. 54-55.
const ESCUELAS = {
  etsii:     { corto: "ETSII", alias: ["industriales", "industrial"], color: "#9b0000", tinta: "#fff",
               nombre: "Escuela Técnica Superior de Ingeniería Industrial" },
  etsit:     { corto: "ETSIT", alias: ["teleco", "telecomunicacion"], color: "#0096d7", tinta: "#fff",
               nombre: "Escuela Técnica Superior de Ingeniería de Telecomunicación" },
  etsia:     { corto: "ETSIA", alias: ["agronomos", "agronomica"], color: "#00c864", tinta: "#000",
               nombre: "Escuela Técnica Superior de Ingeniería Agronómica" },
  etsae:     { corto: "ETSAE", alias: ["arquitectura", "edificacion"], color: "#afa5a5", tinta: "#000",
               nombre: "Escuela Técnica Superior de Arquitectura y Edificación" },
  etsino:    { corto: "ETSINO", alias: ["naval"], color: "#00a08c", tinta: "#fff",
               nombre: "Escuela Técnica Superior de Ingeniería Naval y Oceánica" },
  eicm:      { corto: "EICM", alias: ["caminos", "minas"], color: "#004b82", tinta: "#fff",
               nombre: "Escuela Técnica Superior de Ingeniería de Caminos, Canales y Puertos y de Ingeniería de Minas" },
  fce:       { corto: "Facultad de Ciencias de la Empresa", alias: ["empresa"], color: "#ff4b00", tinta: "#fff",
               nombre: "Facultad de Ciencias de la Empresa" },
  cud:       { corto: "Centro Universitario de la Defensa", alias: ["defensa"], color: "#5a5ab4", tinta: "#fff",
               nombre: "Centro Universitario de la Defensa · Academia General del Aire" },
  doctorado: { corto: "Escuela Internacional de Doctorado", alias: ["eindoc"], color: "#ffc814", tinta: "#000",
               nombre: "Escuela Internacional de Doctorado" },
  formacion: { corto: "Escuela de Formación Continua", alias: ["formacion-continua"], color: "#ff972c", tinta: "#000",
               nombre: "Escuela de Formación Continua" },
};
const escuelaPedida = (params.get("escuela") || "").trim().normalize("NFD")
  .replace(/[̀-ͯ]/g, "").toLowerCase();
const CLAVE_ESCUELA = Object.keys(ESCUELAS).find(k => k === escuelaPedida ||
  ESCUELAS[k].alias.includes(escuelaPedida)) || "etsii";
const ESCUELA = ESCUELAS[CLAVE_ESCUELA];
document.documentElement.style.setProperty("--color", ESCUELA.color);
document.documentElement.style.setProperty("--tinta", ESCUELA.tinta);
const LOGO = "recursos/logos/" + CLAVE_ESCUELA + ".svg";
// Texto en lugar del logo, si no se puede cargar.
const NOMBRE_CENTRO = ESCUELA.corto + " · Universidad Politécnica de Cartagena";
const fechaLarga = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "long" });

// Texto plano a partir de un fragmento con HTML o entidades. Lo que viene del RSS
// nunca se inserta como HTML: siempre con textContent.
function textoPlano(s) {
  return new DOMParser().parseFromString(s || "", "text/html").body.textContent.replace(/\s+/g, " ").trim();
}
const aHttps = u => (u || "").replace(/^http:\/\//i, "https://");
const normalizar = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function crear(etiqueta, clase, texto) {
  const e = document.createElement(etiqueta);
  if (clase) e.className = clase;
  if (texto != null) e.textContent = texto;
  return e;
}

// Logo del centro; si no se puede cargar, en su lugar se pone el nombre (o nada).
function crearLogo(alFallar) {
  const img = crear("img");
  img.alt = "UPCT · " + ESCUELA.nombre;
  img.onerror = alFallar;
  img.src = LOGO;
  return img;
}

async function leerRss() {
  const control = new AbortController();
  const plazo = setTimeout(() => control.abort(), 10000);
  try {
    const r = await fetch(URL_RSS, { signal: control.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const xml = new DOMParser().parseFromString(await r.text(), "application/xml");
    const noticias = [...xml.querySelectorAll("channel > item")].map(it => {
      const q = sel => (it.querySelector(sel)?.textContent || "").trim();
      return {
        titulo: textoPlano(q("title")),
        resumen: textoPlano(q("description")),
        enlace: aHttps(q("link")),
        fecha: q("pubDate"),
        autor: textoPlano(q("author")),
        categoria: textoPlano(q("category")),
        foto: aHttps(q("fotos > foto > url")),
        pieFoto: textoPlano(q("fotos > foto > texto")),
      };
    }).filter(n => n.titulo);
    if (!noticias.length) throw new Error("RSS vacío");
    try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(noticias)); } catch (e) {}
    return noticias;
  } catch (e) {
    // Sin conexión o RSS caído: última copia buena, si la hay.
    try {
      const copia = JSON.parse(localStorage.getItem(CLAVE_CACHE) || "null");
      if (Array.isArray(copia)) return copia;
    } catch (e2) {}
    return [];
  } finally {
    clearTimeout(plazo);
  }
}

// Noticias de la UPCT: las deja en datos/upct.json la tarea programada (scripts/upct.py).
// No tienen sección: sin etiqueta.
async function leerUpct() {
  const control = new AbortController();
  const plazo = setTimeout(() => control.abort(), 10000);
  try {
    const r = await fetch(URL_UPCT, { signal: control.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const noticias = ((await r.json()).noticias || []).map(n => ({
      titulo: textoPlano(n.titulo),
      resumen: textoPlano(n.resumen),
      enlace: aHttps(n.enlace),
      fecha: n.fecha,
      autor: "",
      categoria: "",
      foto: aHttps(n.fotoMediana || n.foto),
      pieFoto: textoPlano(n.pieFoto),
    })).filter(n => n.titulo);
    if (!noticias.length) throw new Error("sin noticias");
    try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(noticias)); } catch (e) {}
    return noticias;
  } catch (e) {
    try {
      const copia = JSON.parse(localStorage.getItem(CLAVE_CACHE) || "null");
      if (Array.isArray(copia)) return copia;
    } catch (e2) {}
    return [];
  } finally {
    clearTimeout(plazo);
  }
}

function elegir(noticias) {
  const buscadas = UPCT ? [] : CATEGORIAS.map(normalizar);
  return noticias
    .map(n => ({ ...n, fecha: new Date(n.fecha) }))
    .filter(n => !buscadas.length || buscadas.includes(normalizar(n.categoria)))
    .sort((x, y) => (y.fecha || 0) - (x.fecha || 0))
    .slice(0, N);
}

function probarFoto(url) {
  return new Promise(ok => {
    if (!url) return ok(null);
    const img = new Image();
    const plazo = setTimeout(() => ok(null), 10000);
    img.onload = () => { clearTimeout(plazo); ok(url); };
    img.onerror = () => { clearTimeout(plazo); ok(null); };
    img.src = url;
  });
}

// Las fotos originales del RSS pueden pesar varios MB. SINC publica una copia de unos
// 1300 px de ancho (la que usa su web) en «_aliases/img_1col/»: se prueba primero esa.
async function cargarFoto(url) {
  if (!url) return null;
  const reducida = url.replace("/storage/images/", "/storage/images/_aliases/img_1col/");
  return (reducida !== url && await probarFoto(reducida)) || probarFoto(url);
}

function ponerQr(contenedor, texto) {
  if (typeof QRCode === "undefined" || !texto) return;
  const caja = crear("div", "qr cambia");
  contenedor.prepend(caja);
  new QRCode(caja, { text: texto, width: 256, height: 256, colorDark: "#000000", colorLight: "#ffffff",
                     correctLevel: QRCode.CorrectLevel.M });
}

// Que todo quepa en su bloque: primero se reduce la letra del titular hasta que el bloque no se
// desborde (y, si aun así no cabe, se recorta a las líneas que quepan); el resumen, a las
// líneas que quepan en el suyo. Los tamaños van en la unidad --u (vh en horizontal, vw en vertical).
const AJUSTE = VERTICAL ? { tam: 8.4, min: 4.6 }
             : A_SANGRE ? { tam: 6.4, min: 4.2 }
             : { tam: 6.6, min: 4 };
// scrollHeight y clientHeight, y no getBoundingClientRect: con la página girada, este daría el ancho.
const desborda = b => b.scrollHeight > b.clientHeight + 1;
function ajustar(bloqueTitulo, titular, bloqueResumen, resumen) {
  titular.style.fontSize = "calc(" + AJUSTE.tam + " * var(--u))";
  titular.style.webkitLineClamp = "";
  // También si una palabra larga («telecomunicaciones») no cabe a lo ancho.
  const ancho = () => titular.scrollWidth > titular.clientWidth + 1;
  for (let tam = AJUSTE.tam; (desborda(bloqueTitulo) || ancho()) && tam > AJUSTE.min; ) {
    tam -= 0.2;
    titular.style.fontSize = "calc(" + tam.toFixed(1) + " * var(--u))";
  }
  if (desborda(bloqueTitulo)) {
    const alto = parseFloat(getComputedStyle(titular).lineHeight);
    const sobra = bloqueTitulo.scrollHeight - bloqueTitulo.clientHeight;
    titular.style.webkitLineClamp = String(Math.max(1, Math.floor((titular.offsetHeight - sobra) / alto)));
  }
  const estilo = getComputedStyle(bloqueResumen);
  const util = bloqueResumen.clientHeight - parseFloat(estilo.paddingTop) - parseFloat(estilo.paddingBottom);
  const lineas = Math.floor(util / parseFloat(getComputedStyle(resumen).lineHeight));
  resumen.style.webkitLineClamp = String(Math.max(1, lineas));
  resumen.hidden = lineas < 1;
}

async function mostrarNoticias(noticias) {
  const marco = crear("div", "noticia oculto");
  // Foto
  const figura = crear("figure", "bloque foto");
  const img = crear("img", "cambia");
  img.alt = "";
  const pieFoto = crear("figcaption", "cambia");
  figura.append(img, pieFoto);
  // Logo (el mismo elemento en todas las noticias: no se vuelve a cargar)
  const marca = crear("div", "bloque marca");
  marca.append(crearLogo(() => { marca.replaceChildren(); }));
  // Titular, con la barra de progreso al pie
  const bloqueTitulo = crear("section", "bloque titulo");
  const meta = crear("div", "meta cambia");
  const titular = crear("h1", "cambia");
  // Barra de progreso: un segmento por noticia o, si son muchas, una barra y un contador.
  const progreso = crear("div", "progreso");
  progreso.style.setProperty("--duracion", SEGUNDOS + "s");
  const segmentos = noticias.length <= MAX_SEGMENTOS;
  const barras = (segmentos ? noticias : [null]).map(() => {
    const barra = crear("i");
    barra.append(crear("b"));
    progreso.append(barra);
    return barra;
  });
  const contador = segmentos ? null : crear("span", "contador");
  if (contador) progreso.append(contador);
  bloqueTitulo.append(meta, titular, progreso);
  // Resumen
  const bloqueResumen = crear("div", "bloque resumen");
  const resumen = crear("p", "cambia");
  bloqueResumen.append(resumen);
  // QR y fuente
  const pie = crear("div", "bloque pie");
  marco.append(figura, marca, bloqueTitulo, bloqueResumen, pie);
  raiz.append(marco);

  // Las fotos se cargan de una en una: la de la noticia actual y, mientras se ve, la siguiente.
  const fotos = [];
  const foto = k => fotos[k] || (fotos[k] = cargarFoto(noticias[k].foto));
  const siguiente = k => (k + 1) % noticias.length;
  let i = ((INICIO % noticias.length) + noticias.length) % noticias.length;

  async function mostrar() {
    const n = noticias[i];
    const url = await foto(i);
    if (noticias.length > 1) foto(siguiente(i));
    marco.classList.toggle("sin-foto", !url);
    if (url) img.src = url; else img.removeAttribute("src");
    pieFoto.textContent = n.pieFoto;
    pieFoto.hidden = !n.pieFoto;

    meta.replaceChildren();
    if (n.categoria) meta.append(crear("span", "cat", n.categoria));
    if (!isNaN(n.fecha)) meta.append(crear("span", "fecha", fechaLarga.format(n.fecha)));
    titular.textContent = n.titulo;
    resumen.textContent = n.resumen;
    const fuente = crear("div", "fuente cambia");
    fuente.append(crear("b", null, "Lee la noticia completa"));
    if (UPCT) {
      fuente.append(document.createTextNode("Noticias de la UPCT"));
    } else {
      fuente.append(document.createTextNode("Agencia SINC" + (n.autor && n.autor !== "SINC" ? " · " + n.autor : "")),
                    crear("br"), document.createTextNode("Licencia CC BY 4.0"));
    }
    pie.replaceChildren(fuente);
    ponerQr(pie, n.enlace);
    ajustar(bloqueTitulo, titular, bloqueResumen, resumen);

    const actual = PAUSA ? "pausa" : "activa";
    if (segmentos) {
      barras.forEach((barra, k) => { barra.className = k < i ? "hecha" : k > i ? "" : actual; });
    } else {
      // Reiniciar la animación de la única barra.
      barras[0].className = "";
      void barras[0].offsetWidth;
      barras[0].className = actual;
      contador.textContent = (i + 1) + " / " + noticias.length;
    }
    marco.classList.remove("oculto");
  }

  // Si cambia el tamaño de la ventana (otra resolución), se vuelve a ajustar el texto.
  window.addEventListener("resize", () => ajustar(bloqueTitulo, titular, bloqueResumen, resumen));

  await mostrar();
  if (PAUSA || noticias.length < 2) return;
  // Cada noticia dura SEGUNDOS, contando el fundido de 0,6 s. Anthias vuelve a cargar la
  // página cada vez que le toca: al acabar, se queda en la última. Vuelve a empezar con
  // bucle=1 o si, con una duración indicada, no hay noticias para llenarla.
  const repetir = BUCLE || (DURACION > 0 && noticias.length * SEGUNDOS < DURACION - MARGEN_CARGA);
  (function programar() {
    setTimeout(async () => {
      if (!repetir && i === noticias.length - 1) return;
      marco.classList.add("oculto");
      await Promise.all([foto(siguiente(i)), new Promise(ok => setTimeout(ok, 600))]);
      i = siguiente(i);
      await mostrar();
      programar();
    }, Math.max(0, SEGUNDOS * 1000 - 600));
  })();
}

function sinNoticias() {
  const v = crear("div", "vacio");
  const p = crear("p");
  const logo = crearLogo(() => logo.replaceWith(NOMBRE_CENTRO));
  p.append(logo, crear("small", null, UPCT ? "Noticias de la UPCT" : "Noticias de ciencia y tecnología"));
  v.append(p);
  raiz.append(v);
}

(async () => {
  const noticias = elegir(await (UPCT ? leerUpct() : leerRss()));
  // Medir con las letras definitivas (Funnel Sans e Inter), no con las de reserva.
  try {
    await Promise.race([
      Promise.all(["500 60px 'Funnel Sans'", "400 30px Inter"].map(f => document.fonts.load(f))),
      new Promise(ok => setTimeout(ok, 3000)),
    ]);
  } catch (e) {}
  if (noticias.length) mostrarNoticias(noticias); else sinNoticias();
})();
</script>
