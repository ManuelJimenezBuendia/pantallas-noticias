# Noticias de la UPCT para la página (?fuente=upct): lee la web de la UPCT y guarda las
# noticias en datos/upct.json. La web de la UPCT no tiene RSS ni deja leerla desde otra web.
name: Noticias de la UPCT

on:
  schedule:
    # Cada hora, a y 17, de 5:17 a 20:17 UTC: de 7 a 21 h en Murcia, en invierno y en verano.
    - cron: "17 5-20 * * *"
  workflow_dispatch:   # para lanzarla a mano desde la pestaña «Actions» de GitHub

permissions:
  contents: write      # guardar datos/upct.json (el push vuelve a publicar la página)

concurrency:
  group: noticias-upct

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Leer las noticias de la UPCT
        run: python3 scripts/upct.py datos/upct.json

      - name: Guardar los cambios
        run: |
          if git diff --quiet -- datos/upct.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/upct.json
          git commit -m "Noticias de la UPCT: actualización automática"
          git pull --rebase
          git push
